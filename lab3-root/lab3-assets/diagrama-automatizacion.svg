<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="900" height="360" fill="#F3F3EF"/>

  <!-- manual side -->
  <g>
    <rect x="40" y="40" width="380" height="270" rx="6" fill="#F3F3EF" stroke="#9C3B2E" stroke-width="2"/>
    <text x="230" y="70" text-anchor="middle" fill="#9C3B2E" font-size="13" font-weight="700">REVISIÓN MANUAL, FILA POR FILA</text>
    <g stroke="#9C3B2E" stroke-width="2">
      <line x1="80" y1="100" x2="380" y2="100"/>
      <circle cx="80" cy="100" r="5" fill="#9C3B2E"/>
    </g>
    <text x="230" y="140" text-anchor="middle" fill="#242B31" font-size="11">línea 1 → revisar</text>
    <text x="230" y="162" text-anchor="middle" fill="#242B31" font-size="11">línea 2 → revisar</text>
    <text x="230" y="184" text-anchor="middle" fill="#242B31" font-size="11">línea 3 → revisar</text>
    <text x="230" y="206" text-anchor="middle" fill="#5B6570" font-size="11">... 87.619 líneas más</text>
    <rect x="90" y="230" width="280" height="50" rx="4" fill="#9C3B2E"/>
    <text x="230" y="255" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">para cuando termine,</text>
    <text x="230" y="270" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">el ataque ya pasó</text>
  </g>

  <!-- vectorized side -->
  <g>
    <rect x="480" y="40" width="380" height="270" rx="6" fill="#F3F3EF" stroke="#1E7F72" stroke-width="2"/>
    <text x="670" y="70" text-anchor="middle" fill="#1E7F72" font-size="13" font-weight="700">PROCESAMIENTO VECTORIZADO</text>
    <rect x="510" y="100" width="320" height="60" rx="4" fill="#1E7F72"/>
    <text x="670" y="125" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">87.622 líneas</text>
    <text x="670" y="145" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">procesadas de una sola vez</text>
    <path d="M670,168 L670,190" stroke="#1E7F72" stroke-width="2.5" marker-end="url(#arrowTeal2)"/>
    <rect x="530" y="196" width="280" height="50" rx="4" fill="#12181D"/>
    <text x="670" y="216" text-anchor="middle" fill="#8FE3C7" font-size="10">ranking listo</text>
    <text x="670" y="234" text-anchor="middle" fill="#8FE3C7" font-size="10">en segundos, no en horas</text>
    <text x="670" y="280" text-anchor="middle" fill="#242B31" font-size="11">funciona igual con 1 millón</text>
    <text x="670" y="296" text-anchor="middle" fill="#242B31" font-size="11">de líneas que con 87 mil</text>
  </g>

  <defs>
    <marker id="arrowTeal2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1E7F72"/></marker>
  </defs>

  <text x="450" y="340" text-anchor="middle" fill="#5B6570" font-size="10.5">La diferencia entre una auditoría puntual y una vigilancia real: si el proceso escala, se puede repetir todos los días.</text>
</svg>
