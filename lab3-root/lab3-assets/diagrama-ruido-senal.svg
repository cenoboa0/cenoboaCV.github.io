<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="900" height="380" fill="#F3F3EF"/>

  <!-- noise cloud of tiny lines -->
  <g>
    <text x="230" y="42" text-anchor="middle" fill="#5B6570" font-size="11" font-weight="700">87.622 LÍNEAS SUELTAS</text>
  </g>
  <g stroke="#9BA3AB" stroke-width="1.4" opacity="0.8">
    <!-- generate a scattery grid of little line marks to suggest unreadable noise -->
    <line x1="60" y1="70" x2="110" y2="70"/><line x1="130" y1="70" x2="170" y2="70"/><line x1="190" y1="70" x2="260" y2="70"/>
    <line x1="60" y1="86" x2="95" y2="86"/><line x1="115" y1="86" x2="180" y2="86"/><line x1="200" y1="86" x2="250" y2="86"/>
    <line x1="60" y1="102" x2="120" y2="102"/><line x1="140" y1="102" x2="170" y2="102"/><line x1="190" y1="102" x2="255" y2="102"/>
    <line x1="60" y1="118" x2="100" y2="118"/><line x1="120" y1="118" x2="190" y2="118"/><line x1="210" y1="118" x2="240" y2="118"/>
    <line x1="60" y1="134" x2="130" y2="134"/><line x1="150" y1="134" x2="180" y2="134"/><line x1="200" y1="134" x2="260" y2="134"/>
    <line x1="60" y1="150" x2="105" y2="150"/><line x1="125" y1="150" x2="175" y2="150"/><line x1="195" y1="150" x2="250" y2="150"/>
    <line x1="60" y1="166" x2="115" y2="166"/><line x1="135" y1="166" x2="195" y2="166"/><line x1="215" y1="166" x2="255" y2="166"/>
    <line x1="60" y1="182" x2="125" y2="182"/><line x1="145" y1="182" x2="170" y2="182"/><line x1="190" y1="182" x2="245" y2="182"/>
    <line x1="60" y1="198" x2="95" y2="198"/><line x1="115" y1="198" x2="185" y2="198"/><line x1="205" y1="198" x2="260" y2="198"/>
    <line x1="60" y1="214" x2="110" y2="214"/><line x1="130" y1="214" x2="175" y2="214"/><line x1="195" y1="214" x2="250" y2="214"/>
    <line x1="60" y1="230" x2="120" y2="230"/><line x1="140" y1="230" x2="190" y2="230"/><line x1="210" y1="230" x2="255" y2="230"/>
    <line x1="60" y1="246" x2="100" y2="246"/><line x1="120" y1="246" x2="180" y2="246"/><line x1="200" y1="246" x2="245" y2="246"/>
    <line x1="60" y1="262" x2="130" y2="262"/><line x1="150" y1="262" x2="185" y2="262"/><line x1="205" y1="262" x2="260" y2="262"/>
  </g>
  <text x="160" y="300" fill="#8A9299" font-size="10">imposible de leer a mano</text>

  <!-- arrow -->
  <path d="M300,175 C 350,175 350,175 400,175" stroke="#B9800E" stroke-width="3" fill="none" marker-end="url(#arrowAmber2)"/>
  <text x="350" y="155" text-anchor="middle" fill="#B9800E" font-size="10" font-weight="700">automatizar</text>

  <!-- clear signal cards -->
  <g>
    <rect x="430" y="90" width="200" height="90" rx="6" fill="#12181D"/>
    <text x="530" y="130" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" font-family="Barlow Semi Condensed, sans-serif">50</text>
    <text x="530" y="152" text-anchor="middle" fill="#9BA3AB" font-size="10">orígenes distintos</text>
  </g>
  <g>
    <rect x="650" y="90" width="200" height="90" rx="6" fill="#12181D"/>
    <text x="750" y="130" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" font-family="Barlow Semi Condensed, sans-serif">453</text>
    <text x="750" y="152" text-anchor="middle" fill="#9BA3AB" font-size="10">usuarios distintos probados</text>
  </g>

  <text x="640" y="230" text-anchor="middle" fill="#1E7F72" font-size="11" font-weight="700">dos cifras que sí se pueden</text>
  <text x="640" y="246" text-anchor="middle" fill="#1E7F72" font-size="11" font-weight="700">discutir en una reunión</text>

  <text x="450" y="345" text-anchor="middle" fill="#5B6570" font-size="10.5">El mismo archivo, antes y después de procesarlo: de ruido ilegible a una cifra que se puede decidir.</text>
</svg>
