<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="900" height="380" fill="#F3F3EF"/>

  <text x="40" y="46" fill="#12181D" font-size="14" font-weight="700">Algunos de los 453 nombres de usuario probados</text>

  <!-- bars -->
  <g>
    <text x="40" y="90" fill="#242B31" font-size="12" font-weight="700">root</text>
    <rect x="180" y="76" width="620" height="22" fill="#9C3B2E"/>
    <text x="810" y="92" fill="#9C3B2E" font-size="10" font-weight="700">cuenta con máximo privilegio</text>
  </g>
  <g>
    <text x="40" y="130" fill="#242B31" font-size="12">appuser</text>
    <rect x="180" y="116" width="330" height="22" fill="#B9800E"/>
    <text x="520" y="132" fill="#5B6570" font-size="10">cuenta de servicio genérica</text>
  </g>
  <g>
    <text x="40" y="170" fill="#242B31" font-size="12">master</text>
    <rect x="180" y="156" width="300" height="22" fill="#B9800E"/>
    <text x="490" y="172" fill="#5B6570" font-size="10">cuenta de servicio genérica</text>
  </g>
  <g>
    <text x="40" y="210" fill="#242B31" font-size="12">admin</text>
    <rect x="180" y="196" width="270" height="22" fill="#B9800E"/>
    <text x="460" y="212" fill="#5B6570" font-size="10">cuenta de servicio genérica</text>
  </g>
  <g>
    <text x="40" y="250" fill="#242B31" font-size="12">leonardo</text>
    <rect x="180" y="236" width="150" height="22" fill="#1E7F72"/>
    <text x="340" y="252" fill="#5B6570" font-size="10">posible nombre real, al azar</text>
  </g>
  <g>
    <text x="40" y="290" fill="#242B31" font-size="12">… 448 más</text>
    <rect x="180" y="276" width="90" height="22" fill="#c7c9c0"/>
  </g>

  <rect x="20" y="320" width="860" height="45" rx="4" fill="#12181D"/>
  <text x="450" y="347" text-anchor="middle" fill="#8FE3C7" font-size="11">Cada intento contra “root” es un intento de tomar control TOTAL del servidor, no solo de una cuenta.</text>
</svg>
